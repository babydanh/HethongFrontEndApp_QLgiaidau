schema: spec-driven

context: |
  Language: vi
  All artifacts must be written in vi.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Dự án: App Flutter quản lý giải đấu (package app_quanly_giaidau, Dart ^3.10.3, Flutter >=3.41.0).
  State: flutter_riverpod 3 (ProviderScope ở lib/main.dart; provider nằm trong lib/providers/ và lib/core/di/).
  Route: go_router 17, một GoRouter ở lib/core/router/app_router.dart.
  Gọi API: Dio qua lib/core/services/dio_client.dart (base URL đọc từ .env: API_BASE_URL); repository ở lib/data/repositories/api/ implement interface trong lib/domain/repositories/.
  Kiến trúc: lib/core, lib/domain, lib/data, lib/features/<tên>, lib/providers. Chuỗi hiển thị: lib/l10n/app_vi.arb (template) + app_en.arb, sinh code bằng gen-l10n.
  Test: flutter_test + mocktail, thư mục test/ (120 file *_test.dart). Hiện KHÔNG có thư mục integration_test/.
  Backend NestJS + Drizzle ở repo HethongBackendApi_QuanlyGiaiDau; Web Next.js ở repo HethongFrontEndWeb_QLgiaidau.
  Nhiều session agent làm song song: mỗi session một worktree (skill git-worktree-lanes),
  mỗi thay đổi một thư mục openspec/changes/<id>/, không ghi plan/spec ra ngoài thư mục đó.

rules:
  proposal:
    - Ghi rõ phần KHÔNG làm (out of scope)
    - Nêu repo khác bị ảnh hưởng (Backend API / Web) nếu có, kèm endpoint hoặc field cụ thể
  specs:
    - Mỗi requirement phải có ít nhất 1 scenario cho đường thành công và 1 scenario cho lỗi hoặc dữ liệu rỗng
    - "Chuỗi hiển thị cho người dùng phải có key i18n ở MỌI file .arb trong lib/l10n/ (hiện: app_vi.arb và app_en.arb), cùng tên key"
  tasks:
    - Mỗi task có tiêu chí xong kiểm chứng được (lệnh test cụ thể, kết quả flutter analyze, hoặc ảnh chụp)
    - Task cuối luôn là flutter analyze trên đúng thư mục đã sửa và flutter test --no-pub của test liên quan

operations:
  apply:
    guidance:
      - Chỉ đánh dấu [x] một task sau khi đã chạy kiểm chứng của task đó và thấy pass
  archive:
    guidance:
      - Chỉ archive khi openspec validate --strict pass và mọi task đã [x]
      - "Trước khi archive: git fetch rồi rebase lên origin/main mới nhất, để so với spec chung mới nhất (session khác có thể vừa archive)"
      - "Nếu archive/validate báo spec chung đã đổi (MODIFIED thiếu scenario/requirement đang có, hoặc ADDED trùng tên đã tồn tại) - tức session khác đã archive trước - thì KHÔNG hỏi lại: tự sửa delta để giữ NGUYÊN phần đang có trong spec chung và thêm phần của change này; ADDED trùng tên thì chuyển thành MODIFIED gộp cả hai. Chạy lại openspec validate --strict rồi archive bình thường"
      - Chỉ dừng hỏi người dùng khi hai bên MÂU THUẪN về nghĩa (cùng điều kiện WHEN nhưng THEN khác nhau, hoặc một bên xóa thứ bên kia cần)
      - CẤM archive không sync, openspec archive --skip-specs hay --no-validate cho change có thư mục specs/ (chỉ dùng --skip-specs khi .openspec.yaml có skip_specs true); openspec-gate.py sẽ chặn khi gộp
